[package]
name = "osk"
version = "0.1.0"
edition = "2021"
description = "A macOS-styled on-screen keyboard written in Rust with Slint"
license = "MIT"
build = "build.rs"

[dependencies]
slint = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
# Keep integer overflow checks on in release builds too: this binary turns
# pointer input into kernel key events, so silently wrapping arithmetic is
# never an acceptable failure mode.
overflow-checks = true
